version: 2

# Dependabot config for Prepio.
#
# Cadence: monthly to keep PR noise low. Bump to "weekly" later if the
# team wants tighter response on advisories. Security advisories ignore
# this schedule and are opened as soon as GitHub detects them.
#
# Note: schedule.day only applies when interval is "weekly" — under
# "monthly" it's silently ignored, so it's omitted here. schedule.time
# and schedule.timezone are honored for all intervals (otherwise
# Dependabot picks a random time in UTC), so they're kept.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
      lint-and-format:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "@playwright/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(actions)"
