name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint rule violations are informational only (exit 1, tolerated below).
      # The lint script runs with --exit-on-fatal-error so parser/config
      # breakage exits 2 and still fails CI instead of being masked by the
      # tolerated baseline.
      - name: Lint (informational)
        run: |
          set +e
          npm run lint
          lint_status=$?
          set -e

          if [ "$lint_status" -eq 0 ] || [ "$lint_status" -eq 1 ]; then
            exit 0
          fi

          exit "$lint_status"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
