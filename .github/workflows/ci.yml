name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint rule violations are informational only (exit 1, tolerated below).
      # The lint script runs with --exit-on-fatal-error so parser/config
      # breakage exits 2 and still fails CI instead of being masked by the
      # tolerated baseline.
      - name: Lint (informational)
        run: |
          set +e
          npm run lint
          lint_status=$?
          set -e

          if [ "$lint_status" -eq 0 ] || [ "$lint_status" -eq 1 ]; then
            exit 0
          fi

          exit "$lint_status"

      - name: Typecheck
        run: npm run typecheck

      # `supabase/functions/**` is in no tsconfig `include`, so the step above
      # does not cover the edge functions — until this step they were
      # type-checked by nothing in CI and a type error there shipped green.
      #
      # deno comes from the `deno` devDependency rather than setup-deno, so
      # `npm ci` above already installed it — one version, pinned by the
      # lockfile, identical in CI and in a local/agent checkout.
      #
      # Non-blocking on introduction: the pre-existing error count in the
      # functions tree is not yet known (it cannot be measured in a sandbox
      # without egress to deno.land/esm.sh). Read the count from this step's
      # log on the first run, set BASELINE in scripts/check-deno-baseline.sh
      # to it, then delete continue-on-error so the ratchet actually gates.
      - name: Typecheck edge functions (informational until baselined)
        continue-on-error: true
        run: npm run typecheck:functions

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
